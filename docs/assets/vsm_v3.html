<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Value Stream Map</title>
<!-- Default page of the value-stream-map skill (MIT). It renders any map: run `vsm.mjs embed <map.json> --page <this file>`.
     To restyle it in an organisation's look, change the tokens in the first :root blocks (colours, font, radius);
     for a full design system, write a new page from the same data (see SKILL.md). -->
<style>
/* The page's own styles, in a layer: a theme (unlayered, injected after) wins over them without heavier selectors. */
@layer page {
:root{
  --bg:#f6f6f4; --surface:#ffffff; --surface-2:#f0f1f3; --ink:#1c1f24; --muted:#5b616b; --line:#d8dbe0; --line-strong:#9aa1ab;
  --wait:#d97a1f; --wait-soft:#fbe7d2; --work:#2c68b0; --work-soft:#d9e6f6;
  --rework:#b42a68; --ai:#6a45bf; --ai-soft:#ece6fa;
  --red:#b83226; --amber:#a86b0c; --green:#2d7a4f; --sel:#ffd34d;
  --mk-good:#2d7a4f; --mk-bad:#b83226; --mk-warn:#a86b0c; --mk-neutral:#5b616b;
  --radius:8px; --shadow:0 1px 2px rgba(0,0,0,.06);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; --font-head:var(--font); --font-num:var(--font);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161a; --surface:#1d2025; --surface-2:#252930; --ink:#e6e8eb; --muted:#a3aab4; --line:#353a42; --line-strong:#6b727d;
    --wait:#eba05a; --wait-soft:#4a3320; --work:#6aa5ea; --work-soft:#1f3550;
    --rework:#ec6fa6; --ai:#b39af0; --ai-soft:#2e2643;
    --red:#f0796d; --amber:#e3b04e; --green:#6cc993; --sel:#c9a227;
    --mk-good:#6cc993; --mk-bad:#f0796d; --mk-warn:#e3b04e; --mk-neutral:#a3aab4;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#14161a; --surface:#1d2025; --surface-2:#252930; --ink:#e6e8eb; --muted:#a3aab4; --line:#353a42; --line-strong:#6b727d;
  --wait:#eba05a; --wait-soft:#4a3320; --work:#6aa5ea; --work-soft:#1f3550;
  --rework:#ec6fa6; --ai:#b39af0; --ai-soft:#2e2643;
  --red:#f0796d; --amber:#e3b04e; --green:#6cc993; --sel:#c9a227;
  --mk-good:#6cc993; --mk-bad:#f0796d; --mk-warn:#e3b04e; --mk-neutral:#a3aab4;
  --shadow:none;
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);overflow-x:hidden}
main{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
h1,h2{font-family:var(--font-head)}
.tot .v{font-family:var(--font-num)}
h1{font-size:22px;line-height:1.25;margin:4px 0 8px}
h2{font-size:16px;margin:0 0 10px}
section{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:14px 0;box-shadow:var(--shadow);min-width:0}
.muted{color:var(--muted)}
.small{font-size:12px}
button{font:inherit;color:inherit}
a{color:var(--work)}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.client{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;padding:5px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.langpick{display:inline-flex;align-items:center;gap:6px}
.langpick select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:4px 8px}
.flowline{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin:6px 0}
.flowline b{font-weight:600}
.team{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lbl-team{margin-right:4px}
.tag.longest-tag{border-color:var(--wait);color:var(--wait)}
.miss-block{margin-bottom:10px}
.hyp-list{list-style:none;padding:0}
.hyp{margin:6px 0}
.legend h3{margin:12px 0 0}
.detail-head{display:flex;justify-content:space-between;gap:8px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;background:var(--surface-2)}
/* totals */
.totals{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.tot{border-left:3px solid var(--line-strong);padding:2px 0 2px 10px;min-width:0}
.tot .v{font-size:28px;font-weight:650;line-height:1.1}
.tot .l{font-size:12px;color:var(--muted)}
.tot.wait{border-color:var(--wait)} .tot.work{border-color:var(--work)}
.tot .sub{font-size:12px;color:var(--red);margin-top:4px}
@media (max-width:720px){.totals{grid-template-columns:repeat(2,minmax(0,1fr))}.tot .v{font-size:22px}}
/* map */
.maphead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.flow-scroll{overflow-x:auto;overflow-y:hidden;border:1px solid var(--line);border-radius:6px;background:var(--bg);-webkit-overflow-scrolling:touch}
.canvas{position:relative;display:grid;grid-auto-flow:column;grid-template-rows:auto var(--lanes,14px) auto;width:max-content;padding:14px 14px 10px}
.canvas svg.arrows{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.link{grid-row:1;align-self:center;padding:0 4px;color:var(--line-strong);font-size:18px;text-align:center;min-width:26px}
.frame{grid-row:1;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--surface);padding:8px 10px 12px;display:flex;flex-direction:column;min-width:0}
.frame.assumed{border-style:dashed}
.fhead{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;margin-bottom:8px;max-width:100%}
.fhead .nm{font-weight:650}
.fhead .sig{font-size:12px;color:var(--muted)}
.fbody{display:flex;align-items:flex-start;gap:0}
.col{display:flex;flex-direction:column;gap:12px}
.unit{display:grid;grid-template-columns:62px 210px;grid-template-areas:". ai" "q box" ". mk"}
.unit.first-up{grid-template-columns:0 210px}
.unit .ais{grid-area:ai;display:flex;flex-direction:column;gap:3px;margin-bottom:4px}
.unit .mks{grid-area:mk;display:flex;flex-direction:column;gap:3px;margin-top:4px}
.q{grid-area:q;align-self:center;text-align:center;color:var(--wait);font-size:12px;line-height:1.15;padding:0 4px}
.q .tri{font-size:18px;display:block}
.q.unknown{color:var(--muted)}
.q.arrow{color:var(--line-strong);font-size:18px}
.q .felt{display:block;font-size:10px;color:var(--muted)}
.box{grid-area:box;position:relative;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:6px;padding:7px 9px;cursor:pointer;text-align:left;width:100%;display:block}
.box:focus-visible{outline:2px solid var(--work);outline-offset:2px}
.box.assumed,.box.confirm{border-style:dashed}
.box.upstream{border-style:dotted;border-width:2px;background:var(--surface-2)}
.box.sel{box-shadow:0 0 0 3px var(--sel)}
.box.end{border-color:var(--rework)}
.box .nm{font-weight:600;line-height:1.25;margin-bottom:3px}
.box .ln{font-size:12px;color:var(--muted)}
.box .ln.tools{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
.box .ln.wk{color:var(--work);font-weight:600}
.box .ln.wk .words{font-weight:400;color:var(--muted)}
.box .ln.wk.unknown{color:var(--muted)}
.ca{font-weight:650}
.ca.red{color:var(--red)} .ca.amber{color:var(--amber)} .ca.ok{color:var(--green)}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tag{display:inline-block;font-size:10.5px;border:1px solid var(--line-strong);border-radius:4px;padding:0 5px;color:var(--muted);white-space:nowrap}
.tag.tc{border-style:dashed}
.tag.rw{border-color:var(--rework);color:var(--rework);font-weight:600}
.tag.felt{border-color:var(--wait);color:var(--wait)}
.ai{font-size:11.5px;background:var(--ai-soft);color:var(--ink);border-left:3px solid var(--ai);border-radius:4px;padding:2px 6px;line-height:1.3}
.ai.confirm{border:1px dashed var(--ai);border-left-width:3px}
.notch{font-family:ui-monospace,Menlo,monospace;color:var(--ai);letter-spacing:-1px;margin-right:4px}
.lvl{font-weight:600;color:var(--ai);margin-right:4px}
.mk{font-size:11.5px;border-left:3px solid var(--mk-neutral);padding:1px 6px;background:var(--surface-2);border-radius:4px;line-height:1.3}
.mk.confirm{border:1px dashed var(--line-strong);border-left-width:3px}
.mk b{font-weight:650}
.mk-accelerates{border-left-color:var(--mk-good)} .mk-slows,.mk-pain{border-left-color:var(--mk-warn)}
.mk-bottleneck,.mk-new-bottleneck,.mk-new-pain{border-left-color:var(--mk-bad)} .mk-duplicate,.mk-not-done{border-left-color:var(--mk-neutral)}
/* macro boxes */
.mbox{grid-row:1;width:224px;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:10px;padding:9px 11px;cursor:pointer;text-align:left;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
.mbox.assumed{border-style:dashed}
.mbox.sel{box-shadow:0 0 0 3px var(--sel)}
.mbox.end{border-color:var(--rework)}
.mbox .nm{font-weight:650;margin-bottom:3px}
.mbox .ln{font-size:12px;color:var(--muted);margin-top:2px}
.mbox .tm{font-size:12.5px;margin-top:5px}
.mbox .tm .w{color:var(--wait);font-weight:600} .mbox .tm .k{color:var(--work);font-weight:600}
.mbox .ln.tools{font-family:ui-monospace,Menlo,monospace;font-size:11px}
.mlink{grid-row:1;align-self:center;text-align:center;color:var(--wait);font-size:12px;padding:0 6px;min-width:58px;line-height:1.15}
.mlink .tri{font-size:18px;display:block}
/* timeline */
.tl{grid-row:3;padding-top:6px;min-width:0}
.bar{display:flex;height:12px;border-radius:3px;overflow:hidden;background:transparent}
.bar .bw{background:var(--wait)} .bar .bk{background:var(--work)}
.bar.up{outline:1.5px dotted var(--line-strong)}
.tl .cap{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap}
.lanehint{font-size:12px;color:var(--muted)}
.arrows path.ln{fill:none;stroke:var(--rework);stroke-width:1.8}
.arrows path.ln.confirm{stroke-dasharray:5 4}
.arrows text{font-size:11px;fill:var(--rework);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;font-weight:600}
.arrows .head{fill:var(--rework)}
.arrows circle{fill:var(--rework)}
.detail{margin-top:10px;border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--surface-2);font-size:13px}
.detail dl{display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;margin:6px 0 0}
.detail dt{color:var(--muted)} .detail dd{margin:0}
/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.longest td{background:var(--wait-soft)}
tr.total td{font-weight:650;border-top:2px solid var(--line-strong)}
tr.up td{font-style:italic;color:var(--muted)}
tr.loop{cursor:pointer}
tr.loop:hover td{background:var(--surface-2)}
tr.loop.on td{background:var(--ai-soft)}
tr.loop.confirm td:first-child{border-left:3px dashed var(--rework)}
.loopbtn{background:none;border:1px solid var(--rework);color:var(--rework);border-radius:4px;padding:1px 7px;cursor:pointer;font-size:12px;white-space:nowrap}
tr.loop.on .loopbtn{background:var(--rework);color:var(--surface)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:720px){.grid2{grid-template-columns:1fr}}
ul.plain{margin:4px 0 0;padding-left:18px} ul.plain li{margin:2px 0}
.st{font-size:11px;font-weight:650;border-radius:4px;padding:0 6px;border:1px solid currentColor;margin-right:6px;white-space:nowrap}
.st-confirmed{color:var(--green)} .st-refuted{color:var(--red)} .st-partial{color:var(--amber)} .st-open{color:var(--muted)}
details.legend summary{cursor:pointer;font-weight:650;font-size:16px}
.legend-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:6px 18px;margin-top:10px;font-size:13px}
.legend-grid .sym{display:inline-block;min-width:46px;font-weight:650}
ol.steps{margin:4px 0 12px;padding-left:20px} ol.steps li{margin:3px 0}
.btn{border:1px solid var(--line-strong);background:var(--surface-2);border-radius:6px;padding:6px 14px;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#copyArea{width:100%;min-height:140px;margin-top:10px;font:12px ui-monospace,Menlo,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px}
.log li{margin:2px 0}
.log .at{font-variant-numeric:tabular-nums;color:var(--muted);margin-right:8px}
}
</style>

  --grid-minor:rgba(255,255,255,.055); --grid-major:rgba(255,255,255,.12); --hatch:rgba(240,245,255,.34);
}

/* ---------- the sheet ---------- */
body{
  font:14px/1.45 var(--font);
  background-color:var(--bg);
  background-image:
    linear-gradient(var(--grid-major) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-major) 1px,transparent 1px),
    linear-gradient(var(--grid-minor) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-minor) 1px,transparent 1px);
  background-size:40px 40px,40px 40px,8px 8px,8px 8px;
}
main{
  counter-reset:sec;
  position:relative;
  margin:28px auto 40px;
  padding:30px 30px 44px;
  border:1.5px solid var(--ink);
  box-shadow:0 0 0 5px var(--bg),0 0 0 6px var(--ink);
  max-width:1180px;
}
/* zone ticks along the sheet border, as on a drawing frame */
main::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(90deg,var(--ink) 1px,transparent 1px) 0 0/calc(100% / 12) 7px repeat-x,
    linear-gradient(90deg,var(--ink) 1px,transparent 1px) 0 100%/calc(100% / 12) 7px repeat-x,
    linear-gradient(var(--ink) 1px,transparent 1px) 0 0/7px 160px repeat-y,
    linear-gradient(var(--ink) 1px,transparent 1px) 100% 0/7px 160px repeat-y;
}
@media (max-width:720px){
  main{margin:12px 8px 24px;padding:20px 12px 28px;box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--ink)}
}
a{color:var(--work);text-underline-offset:3px;text-decoration-thickness:1px}
.muted{color:var(--muted)}

/* ---------- title block (cartouche) ---------- */
#hdr{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(150px,230px);
  grid-template-areas:"title dwg" "title lang" "flow flow" "team team";
  gap:1px;background:var(--ink);border:2px solid var(--ink);
  margin:0 0 30px;
}
#hdr>.topbar{display:contents}
#hdr>.topbar>div:first-child,#hdr>.flowline,#hdr>.team,#hdr::before{background:var(--surface);padding:12px 16px;min-width:0}
#hdr>.topbar>div:first-child{grid-area:title;padding:14px 18px 16px}
#hdr .client{font:500 11px/1.3 var(--mono);letter-spacing:.16em;color:var(--muted)}
#hdr .client::before{content:"⌖ ";letter-spacing:0}
#hdr h1{font:600 28px/1.15 var(--font);letter-spacing:-.005em;margin:8px 0 0;text-wrap:balance}
#hdr::before{
  grid-area:dwg;
  content:"VALUE STREAM MAP\A SCALE 1 d = 22 px";white-space:pre-wrap;
  font:500 10.5px/1.7 var(--mono);letter-spacing:.14em;color:var(--muted);
  display:flex;align-items:center;
}
:root:lang(fr) #hdr::before{content:"CARTE DE LA CHAÎNE DE VALEUR\A ÉCHELLE 1 j = 22 px"}
#hdr:not(:has(.seg,.langpick))::before{grid-area:1 / 2 / 3 / 3}
#hdr>.topbar>.seg,#hdr>.topbar>.langpick{grid-area:lang;display:flex;border:0;border-radius:0;background:var(--surface);overflow:visible}
#hdr>.topbar>.seg button{flex:1;padding:8px 10px}
#hdr>.topbar>.langpick{padding:8px 12px;gap:10px}
#hdr .langpick select{border-radius:0;border-color:var(--ink);font:12px var(--mono);flex:1;min-width:0}
/* trigger → end: two labelled cells */
#hdr>.flowline{
  grid-area:flow;margin:0;
  display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-rows:auto auto;
  gap:3px 16px;align-items:start;
}
#hdr>.flowline>span.muted:nth-of-type(1){grid-area:1/1}
#hdr>.flowline>b:nth-of-type(1){grid-area:2/1}
#hdr>.flowline>span[aria-hidden]{grid-area:1/2/3/3;align-self:center;font:18px var(--mono);color:var(--ink)}
#hdr>.flowline>span.muted:nth-of-type(3){grid-area:1/3}
#hdr>.flowline>b:nth-of-type(2){grid-area:2/3}
#hdr>.flowline b{font-weight:600;font-size:15px;line-height:1.3}
#hdr .flowline>span.muted,#hdr .team>span.muted{font:500 10px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}
#hdr>.team{grid-area:team;margin:0;align-items:center;gap:6px}
#hdr>.team>span.muted{margin-right:10px !important}
.chip{border-radius:0;border:1px solid var(--line-strong);background:transparent;font:11px/1.6 var(--mono);padding:0 7px}
@media (max-width:720px){
  #hdr{grid-template-columns:minmax(0,1fr);grid-template-areas:"title" "dwg" "lang" "flow" "team"}
  #hdr:not(:has(.seg,.langpick))::before{grid-area:dwg}
  #hdr h1{font-size:22px}
  #hdr>.topbar>div:first-child,#hdr>.flowline,#hdr>.team,#hdr::before{padding:10px 12px}
}

/* ---------- sections: drawing panels with registration marks ---------- */
section{
  position:relative;counter-increment:sec;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:0;box-shadow:none;
  padding:18px 20px 20px;margin:30px 0;
}
section::after{
  content:"";position:absolute;inset:-7px;pointer-events:none;
  --m:linear-gradient(var(--ink),var(--ink));
  background:
    var(--m) 0 0/14px 1.5px no-repeat, var(--m) 0 0/1.5px 14px no-repeat,
    var(--m) 100% 0/14px 1.5px no-repeat, var(--m) 100% 0/1.5px 14px no-repeat,
    var(--m) 0 100%/14px 1.5px no-repeat, var(--m) 0 100%/1.5px 14px no-repeat,
    var(--m) 100% 100%/14px 1.5px no-repeat, var(--m) 100% 100%/1.5px 14px no-repeat;
}
@media (max-width:720px){section{padding:14px 12px 16px;margin:24px 0}section::after{inset:-5px}}

/* headings: numbered view callouts with a leader rule */
h2,details.legend summary{
  font:500 12px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.18em;color:var(--ink);
  display:flex;align-items:center;gap:12px;margin:0 0 16px;
}
h2::before,details.legend summary::before{
  content:counter(sec,decimal-leading-zero);
  font:500 11px/1 var(--mono);letter-spacing:.06em;
  color:var(--surface);background:var(--ink);padding:4px 6px;flex:none;
}
h2::after,details.legend summary::after{content:"";flex:1;height:1px;background:var(--line-strong);min-width:16px}
[data-part="ideas"]>div:first-child h2::before{content:counter(sec,decimal-leading-zero) ".A"}
[data-part="ideas"]>div:last-child h2::before{content:counter(sec,decimal-leading-zero) ".B"}
details.legend summary{list-style:none;margin:0;cursor:pointer}
details.legend summary::-webkit-details-marker{display:none}
details.legend summary::after{background:linear-gradient(var(--line-strong),var(--line-strong)) 0 50%/100% 1px no-repeat;height:auto;content:"[+]";text-align:right;color:var(--muted);letter-spacing:0}
details.legend[open] summary::after{content:"[−]"}
details.legend[open] summary{margin-bottom:6px}
.legend-grid h3,#legend h3{font:500 10px var(--mono);letter-spacing:.16em;text-transform:uppercase}
.legend-grid .sym{font-family:var(--mono);font-weight:500;font-size:12px}
.note,.lanehint{font-size:12.5px}

/* ---------- totals: a specification table ---------- */
.totals{gap:1px;background:var(--line-strong);border:1.5px solid var(--ink)}
.tot{display:flex;flex-direction:column;background:var(--surface);border:0;padding:12px 14px 14px;position:relative}
.tot.wait,.tot.work{border:0}
.tot .l{order:-1;font:500 10px/1.45 var(--mono);text-transform:uppercase;letter-spacing:.11em;color:var(--muted);min-height:2.9em}
.tot .v{font:500 30px/1.05 var(--mono);letter-spacing:-.02em;margin-top:8px}
.tot.wait .v{color:var(--wait)} .tot.work .v{color:var(--work)}
.tot.wait::before,.tot.work::before{content:"";position:absolute;left:0;right:0;top:0;height:5px}
.tot.wait::before{background:repeating-linear-gradient(-45deg,var(--wait) 0 2px,transparent 2px 4px);border-bottom:1px solid var(--wait)}
.tot.work::before{background:var(--work)}
.tot .sub{font-size:12px;margin-top:8px;padding-top:6px;border-top:1px dashed var(--line)}
@media (max-width:720px){
  .tot .v{font-size:23px}
  .tot:last-child{grid-column:1/-1}
}

/* ---------- the map ---------- */
.maphead{margin-bottom:6px}
.maphead h2{flex:1;margin:0}
.seg{border:1px solid var(--ink);border-radius:0}
.seg button{font:500 11px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.12em;padding:6px 14px}
.seg button+button{border-left:1px solid var(--ink)}
.flow-scroll{
  border:1px solid var(--ink);border-radius:0;
  background-color:var(--bg);
  background-image:
    linear-gradient(var(--grid-major) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-major) 1px,transparent 1px),
    linear-gradient(var(--grid-minor) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-minor) 1px,transparent 1px);
  background-size:40px 40px,40px 40px,8px 8px,8px 8px;
  background-attachment:local;
}
.canvas{isolation:isolate;padding:22px 22px 14px}
.link{font:16px var(--mono);color:var(--line-strong)}

/* stage frames: an assembly boundary with corner ticks */
.frame{position:relative;background:transparent;border:1px solid var(--line-strong);border-radius:0;padding:0 14px 16px}
.frame::after{
  content:"";position:absolute;inset:-4px;pointer-events:none;
  --m:linear-gradient(var(--ink),var(--ink));
  background:
    var(--m) 0 0/9px 1px no-repeat, var(--m) 0 0/1px 9px no-repeat,
    var(--m) 100% 0/9px 1px no-repeat, var(--m) 100% 0/1px 9px no-repeat,
    var(--m) 0 100%/9px 1px no-repeat, var(--m) 0 100%/1px 9px no-repeat,
    var(--m) 100% 100%/9px 1px no-repeat, var(--m) 100% 100%/1px 9px no-repeat;
}
.fhead{margin:0 -14px 14px;padding:8px 14px;border-bottom:1px solid var(--line-strong);background:var(--surface);gap:2px 12px;max-width:none}
.fhead .nm{font:500 11.5px/1.35 var(--mono);text-transform:uppercase;letter-spacing:.12em}
.fhead .sig{font:10.5px/1.35 var(--mono);color:var(--muted)}

/* boxes: outlined components with a hatched section shadow */
.box,.mbox{
  position:relative;background:var(--surface);
  border:1px solid var(--ink);border-radius:0;
}
.box{padding:8px 10px 9px}
.mbox{padding:10px 12px 11px}
.box::before,.mbox::before{
  content:"";position:absolute;inset:5px -6px -6px 5px;z-index:-1;pointer-events:none;
  background:repeating-linear-gradient(-45deg,var(--hatch) 0 1px,transparent 1px 4px);
}
.box .nm,.mbox .nm{font-weight:600;font-size:14px;line-height:1.25}
.mbox .nm{padding-bottom:6px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.box .ln,.mbox .ln{font-size:12.5px}
.box .ln.tools,.mbox .ln.tools{font:11px/1.4 var(--mono)}
.box .ln.wk{font-family:var(--mono);font-size:11.5px;font-weight:500}
.box .ln.wk .words{font-family:var(--font);font-size:12px}
.mbox .tm{font:11.5px/1.5 var(--mono);margin:6px 0 4px;padding:4px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.mbox .tm .w,.mbox .tm .k{font-weight:500}
.ca{font-family:var(--mono);font-weight:500}
.box:focus-visible,.mbox:focus-visible{outline:2px solid var(--work);outline-offset:3px}
/* restated variants (this unlayered file would otherwise win over them) */
.box.assumed,.box.confirm,.mbox.assumed,.frame.assumed{border-style:dashed}
.box.upstream{border-style:dotted;border-width:2px;background:var(--surface-2)}
.box.upstream::before{opacity:.5}
.box.end,.mbox.end{border-color:var(--rework)}
.box.sel,.mbox.sel{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--sel)}

/* queues */
.q,.mlink{font:500 11px/1.2 var(--mono)}
.q .tri,.mlink .tri{font-size:17px;line-height:1.1}
.q .felt{font:10px var(--mono);text-transform:uppercase;letter-spacing:.06em}
.q.arrow{font-family:var(--mono)}

/* tags: stencil labels */
.tag{font:500 9.5px/1.6 var(--mono);text-transform:uppercase;letter-spacing:.07em;border-radius:0;padding:0 5px;border:1px solid var(--line-strong);color:var(--muted)}
.tag.tc{border-style:dashed}
.tag.rw{border-color:var(--rework);color:var(--rework);font-weight:500}
.tag.felt{border-color:var(--wait);color:var(--wait)}

/* AI uses and markers: leader notes */
.ai{font-size:11.5px;border-radius:0;background:var(--surface);border:1px solid var(--ai);border-left-width:3px;padding:3px 7px}
.ai.confirm{border-style:dashed;border-left-style:solid}
.notch{font-family:var(--mono);letter-spacing:0}
.lvl{font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.08em}
.mk{font-size:11.5px;border-radius:0;background:var(--surface);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-left-width:3px;padding:3px 7px}
.mk b{font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.08em}
.mk.confirm{border-top-style:dashed;border-right-style:dashed;border-bottom-style:dashed;border-top-color:var(--line-strong);border-right-color:var(--line-strong);border-bottom-color:var(--line-strong)}

/* ---------- timeline: dimension lines (extension ticks at both ends, a thin datum through the middle) ---------- */
.tl{padding-top:12px}
.bar{
  height:15px;align-items:center;border-radius:0;overflow:visible;
  background:
    linear-gradient(var(--ink),var(--ink)) 0 0/1px 100% no-repeat,
    linear-gradient(var(--ink),var(--ink)) 100% 0/1px 100% no-repeat,
    linear-gradient(var(--ink),var(--ink)) 0 50%/100% 1px no-repeat;
}
.bar .bw,.bar .bk{height:7px;flex:none}
.bar .bk{box-shadow:inset 1px 0 0 var(--surface)}
.bar.up{outline:1.5px dotted var(--line-strong);outline-offset:1px}
.tl .cap{font:10.5px/1.3 var(--mono);color:var(--muted);margin-top:4px;letter-spacing:.02em}
.legend-grid .bar{height:13px}

/* rework arrows (drawn by the page) */
.arrows path.ln{stroke-width:1.4}
.arrows text{font:500 10.5px var(--mono);letter-spacing:.03em}

/* selection detail: a detail callout */
.detail{border-radius:0;border:1px solid var(--ink);background:var(--surface);padding:12px 14px;border-left-width:4px}
.detail dt{font:500 10px/1.8 var(--mono);text-transform:uppercase;letter-spacing:.1em}

/* ---------- tables ---------- */
table{font-size:13px}
th{font:500 10px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);border-top:1.5px solid var(--ink);border-bottom:1px solid var(--ink);padding:8px}
td{border-bottom:1px solid var(--line)}
td.num{font:12.5px var(--mono)}
tr.total td{border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);font-weight:600}
tr.total td.num{font-weight:500}
tr.up td{font-style:normal}
tr.up td:nth-child(2){font-style:italic}
tr.longest td{background:repeating-linear-gradient(-45deg,var(--wait-soft) 0 6px,transparent 6px 9px),var(--surface)}
.loopbtn{border-radius:0;font:500 10px/1.6 var(--mono);text-transform:uppercase;letter-spacing:.06em}
tr.loop.confirm td:first-child{border-left:3px dashed var(--rework)}

/* hypotheses: stamped statuses */
.st{border-radius:0;font:500 9.5px/1.6 var(--mono);text-transform:uppercase;letter-spacing:.1em;padding:0 6px;border-width:1.5px}
#hyp b{font-family:var(--mono);font-weight:500}

/* missing: checklists */
#missing b{font:500 10.5px/1.5 var(--mono);text-transform:uppercase;letter-spacing:.08em}
ul.plain{padding-left:0;list-style:none}
ul.plain li{position:relative;padding-left:16px}
ul.plain li::before{content:"";position:absolute;left:2px;top:.6em;width:6px;height:1px;background:var(--line-strong)}
#hyp ul.plain li{padding-left:0}
#hyp ul.plain li::before{display:none}
.log .at{font:12px var(--mono);color:var(--muted)}
ol.steps{padding-left:0;list-style:none;counter-reset:st}
ol.steps li{counter-increment:st;position:relative;padding-left:34px;margin:8px 0}
ol.steps li::before{content:counter(st,decimal-leading-zero);position:absolute;left:0;top:1px;font:500 10px/1 var(--mono);border:1px solid var(--ink);padding:3px 4px}

/* buttons and inputs */
.btn{border-radius:0;font:500 11px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.1em;padding:8px 16px;border-color:var(--ink)}
#copyArea{border-radius:0;font:12px var(--mono);border-color:var(--ink)}

</style>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const D = JSON.parse($('#vsm-data').textContent || '{}');
const S = JSON.parse($('#vsm-summary').textContent || '{}');
if (D.case && D.case.title) document.title = D.case.title;
const PX = 22; // pixels per working day, shared by the timeline and the per-stage table
const LEVELS = ['assistant', 'tooled', 'prepares', 'chains'];
const KINDS = ['accelerates', 'slows', 'bottleneck', 'new-bottleneck', 'pain', 'new-pain', 'duplicate', 'not-done'];

// Page labels: the JSON block "vsm-ui" (English and French built in). A map adds or overrides any language in its
// "ui" field (same keys); a missing key falls back to English. A label with {n}, {m}, {b} or {l} is a template;
// {"one", "other"} picks by the first number.
const UI = JSON.parse(document.getElementById('vsm-ui').textContent);
const FN = { caOver: ['n'], incomplete: ['n', 'm'], upstreamNote: ['b', 'l'], boxesNoWork: ['n'], loopsN: ['n'] };
const merge = (a, b) => { const o = { ...a }; for (const [k, v] of Object.entries(b || {})) o[k] = v && typeof v === 'object' && !Array.isArray(v) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k]) && !('one' in v) ? merge(a[k], v) : v; return o; };
const labelsFor = (l) => {
  const d = merge(merge(UI.en, UI[l]), (D.ui || {})[l]);
  for (const [k, names] of Object.entries(FN)) {
    const t = d[k];
    d[k] = (...args) => { const tpl = t && typeof t === 'object' ? (args[0] === 1 ? t.one : t.other) : String(t || ''); return tpl.replace(/\{(\w)\}/g, (m, x) => (names.includes(x) ? args[names.indexOf(x)] : m)); };
  }
  return d;
};

// Languages: map.languages, the first being the one the map is written in (default ["en"]); i18n.<lang> translates
// whole texts into the others. Older maps with only i18n.fr read as ["en", "fr"].
const LANGS = Array.isArray(D.languages) && D.languages.length ? D.languages : ['en', ...Object.keys(D.i18n || {})];
const SRC = LANGS[0];
let lang = SRC, view = 'macro', sel = null;
try { const l = localStorage.getItem('vsm-lang'); if (LANGS.includes(l)) lang = l; } catch (e) {}

const LBL = {};
const T = () => (LBL[lang] = LBL[lang] || labelsFor(lang));
const tr = (s) => (s == null || lang === SRC ? s : ((D.i18n || {})[lang] || {})[s] || s);
const langName = (l) => { const n = merge(merge(UI.en, UI[l]), (D.ui || {})[l]).langName; if (n && (UI[l] || (D.ui || {})[l])) return n; try { return new Intl.DisplayNames([l], { type: 'language' }).of(l); } catch (e) { return l.toUpperCase(); } };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const E = (s) => esc(tr(s));
// A list put together from several boxes ("Product, Design, Security"): the whole text if it was translated, else item by item.
const EL = (s) => { if (s == null) return ''; const t = tr(s); return esc(t !== s ? t : String(s).split(/\s*,\s*/).map(tr).join(', ')); };

// numbers: days with one decimal, under a day in hours (1 d = 8 h)
const dec = (v, n) => { try { return new Intl.NumberFormat(lang, { minimumFractionDigits: n, maximumFractionDigits: n, useGrouping: false }).format(v); } catch (e) { return v.toFixed(n); } };
const unitD = () => T().dayUnit;
function fmtDays(v) {
  if (v == null) return '?';
  if (v > 0 && v < 1) { const h = Math.round(v * 8 * 10) / 10; return `${dec(h, Number.isInteger(h) ? 0 : 1)} h`; }
  return `${dec(v, 1)} ${unitD()}`;
}
function fmtDur(d) {
  if (!d) return '?';
  const ap = d.approx ? '~' : '';
  if (d.min != null && d.max != null) return `${ap}${fmtDays(d.min)}–${fmtDays(d.max)}`;
  if (d.max != null && d.min == null) return `≤ ${fmtDays(d.max)}`;
  return `${ap}${fmtDays(d.days)}`;
}
const pct = (v) => (v == null ? '?' : `${v} %`);
const caClass = (v) => (v < 70 ? 'red' : v < 90 ? 'amber' : 'ok');
const notch = (lvl) => { const i = LEVELS.indexOf(lvl) + 1; return '▮'.repeat(Math.max(i, 0)) + '▯'.repeat(4 - Math.max(i, 0)); };
const durTitle = (d) => { if (!d) return ''; const p = []; if (d.text) p.push(`“${tr(d.text)}”`); if (d.felt) p.push(T().felt); if (d.source) p.push(`${T().source}: ${tr(d.source)}`); return p.join(' · '); };

// lookups
const stageById = (id) => (D.stages || []).find((s) => s.id === id);
const sumById = (id) => (S.stages || []).find((s) => s.id === id);
const stepOf = (sid, pid) => { const s = stageById(sid); return s && pid ? (s.steps || []).find((x) => x.id === pid) : null; };
const boxName = (sid, pid) => { const s = stageById(sid); const p = stepOf(sid, pid); return `${tr(s ? s.name : sid)}${p ? ' / ' + tr(p.name) : ''}`; };
const loops = D.loops || [];
const isIter = (l) => l.from === l.to && (l.fromStep || '') === (l.toStep || '');
const outOf = (sid, pid) => loops.filter((l) => l.from === sid && (l.fromStep || '') === (pid || '') && !isIter(l)).length;
const itOf = (sid, pid) => loops.filter((l) => l.from === sid && (l.fromStep || '') === (pid || '') && isIter(l)).length;

// ---------- header, totals ----------
function renderHeader() {
  const c = D.case || {};
  $('#hdr').innerHTML = `
    <div class="topbar">
      <div class="title-block" style="min-width:0">
        <div class="client">${E(c.client)}</div>
        <h1>${E(c.title)}</h1>
      </div>
      ${LANGS.length === 2 ? `<div class="seg" role="group" aria-label="${T().langLabel}">${LANGS.map((l) => `<button type="button" data-lang="${esc(l)}" aria-pressed="${lang === l}" title="${esc(langName(l))}">${esc(l.toUpperCase())}</button>`).join('')}</div>`
        : LANGS.length > 2 ? `<label class="langpick"><span class="muted small">${T().langLabel}</span> <select id="langSel">${LANGS.map((l) => `<option value="${esc(l)}"${lang === l ? ' selected' : ''}>${esc(langName(l))}</option>`).join('')}</select></label>` : ''}
    </div>
    <div class="flowline"><span class="muted lbl lbl-trigger">${T().trigger}</span> <b class="trigger">${E(c.trigger)}</b> <span class="arr" aria-hidden="true">→</span> <span class="muted lbl lbl-end">${T().end}</span> <b class="end-text">${E(c.end)}</b></div>
    <div class="team"><span class="muted small lbl lbl-team">${T().team}</span>${(c.team || []).map((m) => `<span class="chip">${E(m)}</span>`).join('')}</div>`;
  const setLang = (l) => { lang = l; try { localStorage.setItem('vsm-lang', lang); } catch (e) {} renderAll(); };
  document.querySelectorAll('[data-lang]').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.lang)));
  const ls = $('#langSel'); if (ls) ls.addEventListener('change', () => setLang(ls.value));
}
function renderTotals() {
  const t = S.totals || {}, u = T();
  // No duration recorded anywhere yet: show "?" rather than a lead time of 0.
  const none = (S.stages || []).length > 0 && (t.stagesWithoutDurations || 0) === S.stages.length;
  const days = (v) => (none ? '?' : fmtDays(v));
  const sub = t.incompleteStages > 0 ? `<div class="sub">${esc(u.incomplete(t.incompleteStages, t.stagesWithoutDurations || 0))}</div>` : '';
  $('#totals').innerHTML = `
    <div class="tot lead"><div class="v">${days(t.lead)}</div><div class="l">${u.lead} · ${u.leadSub}</div>${sub}</div>
    <div class="tot work"><div class="v">${days(t.work)}</div><div class="l">${u.work}</div></div>
    <div class="tot wait"><div class="v">${days(t.wait)}</div><div class="l">${u.wait}</div></div>
    <div class="tot fe"><div class="v">${pct(t.flowEfficiency)}</div><div class="l">${u.fe} · ${u.feSub}</div></div>
    <div class="tot rca"><div class="v">${t.rolledCA == null ? esc(u.notMeasured) : pct(t.rolledCA)}</div><div class="l">${u.rca}${t.rolledCA == null ? '' : ' · ' + esc(u.caOver(t.caMeasuredBoxes))}</div></div>`;
  const notes = [];
  if (t.note) notes.push(E(t.note));
  if (S.upstream && S.upstream.boxes) notes.push(esc(u.upstreamNote(S.upstream.boxes, fmtDays(S.upstream.lead))));
  $('#totNote').innerHTML = notes.join('<br>');
}

// ---------- the flow ----------
function aiHtml(list) {
  return (list || []).map((a) => `<div class="ai${a.confirm ? ' confirm' : ''}" title="${esc(T().lvd[a.level] || a.level)}${a.who ? ' · ' + esc(T().who) + ': ' + E(a.who) : ''}"><span class="notch" aria-hidden="true">${notch(a.level)}</span><span class="lvl">${esc(T().lv[a.level] || a.level)}</span>${E(a.label)}${a.confirm ? ` <span class="tag tc">${T().toConfirm}</span>` : ''}</div>`).join('');
}
function mkHtml(list) {
  return (list || []).map((m) => `<div class="mk mk-${esc(m.kind)}${m.confirm ? ' confirm' : ''}" title="${m.source ? esc(T().source + ': ' + tr(m.source)) : ''}"><b>${esc(T().mk[m.kind] || m.kind)}</b> · ${E(m.text)}${m.source ? ` <span class="muted">(${E(m.source)})</span>` : ''}${m.confirm ? ` <span class="tag tc">${T().toConfirm}</span>` : ''}</div>`).join('');
}
function queueHtml(w, opts = {}) {
  if (opts.arrow) return `<div class="q arrow" aria-hidden="true">→</div>`;
  if (!w) return `<div class="q unknown" title="${esc(T().waitT)}: ?"><span class="tri">▽</span>?</div>`;
  if (!w.days && w.min == null && w.max == null) return `<div class="q arrow" aria-hidden="true">→</div>`;
  return `<div class="q" title="${esc(T().waitT)} · ${esc(durTitle(w))}"><span class="tri">▽</span>${fmtDur(w)}${w.felt ? `<span class="felt">${T().felt}</span>` : ''}</div>`;
}
function boxInner(x, sid, pid, extraTags) {
  const u = T();
  const lines = [`<div class="nm">${E(x.name)}</div>`];
  const who = pid ? x.who : x.actors;
  if (who) lines.push(`<div class="ln">${E(who)}</div>`);
  if (x.tools) lines.push(`<div class="ln tools">${E(x.tools)}</div>`);
  if (x.work) lines.push(`<div class="ln wk" title="${esc(durTitle(x.work))}">${u.workT} ${fmtDur(x.work)}${x.work.text ? ` <span class="words">“${E(x.work.text)}”</span>` : ''}${x.work.felt ? ` <span class="tag felt">${u.felt}</span>` : ''}</div>`);
  else lines.push(`<div class="ln wk unknown">${u.workT} ?</div>`);
  if (typeof x.ca === 'number') lines.push(`<div class="ln" title="${x.caSource ? esc(u.source + ': ' + tr(x.caSource)) : ''}">${u.ca} <span class="ca ${caClass(x.ca)}">${x.caApprox ? '~' : ''}${x.ca} %</span>${x.caApprox ? ` <span class="tag felt">${u.felt}</span>` : ''}</div>`);

  const tags = [...extraTags];
  const o = outOf(sid, pid), it = itOf(sid, pid);
  if (o) tags.push(`<span class="tag rw" title="${u.reworkOut}">↩ ${o}</span>`);
  if (it) tags.push(`<span class="tag rw" title="${u.iterations}">↻ ${it}</span>`);

}
function renderDetailed(cv) {
  const u = T();
  let html = '';
  (D.stages || []).forEach((s, i) => {
    const sm = sumById(s.id) || {};
    if (i > 0) html += `<div class="link" aria-hidden="true">→</div>`;
    const steps = s.steps || [];
    let body = '';
    if (!steps.length) {
      const tags = [`<span class="tag">${u.notDetailed}</span>`];
      if (s.status !== 'confirmed') tags.push(`<span class="tag tc">${u.toConfirm}</span>`);
      body = `<div class="col" data-col><div class="unit" data-stage="${esc(s.id)}" data-step="">
        <div class="ais">${aiHtml(s.ai)}</div>${queueHtml(s.wait)}
        <button type="button" class="box${s.status !== 'confirmed' ? ' assumed' : ''}" data-box="${esc(s.id)}|">${boxInner(s, s.id, null, tags)}</button>
        <div class="mks">${mkHtml(s.markers)}</div></div></div>`;
    } else {
      const groups = [];
      steps.forEach((x) => { if (x.parallel && groups.length) groups[groups.length - 1].push(x); else groups.push([x]); });
      groups.forEach((g, gi) => {
        body += `<div class="col" data-col>`;
        g.forEach((x) => {
          const up = x.phase === 'upstream';
          const tags = [];
          if (up) tags.push(`<span class="tag">${u.upstream}</span>`);
          if (x.parallel) tags.push(`<span class="tag">‖ ${u.parallel}</span>`);
          if (x.status === 'assumed') tags.push(`<span class="tag tc">${u.toConfirm}</span>`);
          const cls = ['box']; if (up) cls.push('upstream'); if (x.status === 'assumed') cls.push('assumed');
          const firstUp = up && gi === 0;
          body += `<div class="unit${firstUp ? ' first-up' : ''}" data-stage="${esc(s.id)}" data-step="${esc(x.id)}">
            <div class="ais">${aiHtml(x.ai)}</div>${firstUp ? '<div class="q"></div>' : queueHtml(up ? null : x.wait, { arrow: up })}
            <button type="button" class="${cls.join(' ')}" data-box="${esc(s.id)}|${esc(x.id)}">${boxInner(x, s.id, x.id, tags)}</button>
            <div class="mks">${mkHtml(x.markers)}</div></div>`;
        });
        body += `</div>`;
      });
    }
    const times = sm.noDurations ? '?' : `▽ ${fmtDays(sm.wait)} · ${u.workT.toLowerCase()} ${fmtDays(sm.work)} · ${u.leadShort} ${fmtDays(sm.lead)}`;
    html += `<div class="frame${s.status !== 'confirmed' ? ' assumed' : ''}" data-frame="${esc(s.id)}">
      <div class="fhead"><span class="nm">${sm.n || i + 1}. ${E(s.name)}</span>${s.status !== 'confirmed' ? `<span class="tag tc">${u.toConfirm}</span>` : ''}${!steps.length ? `<span class="tag">${u.notDetailed}</span>` : ''}<span class="sig">${u.sigma} ${times}</span></div>
      <div class="fbody">${body}</div></div>`;
  });
  html += timelineHtml(true);
  cv.innerHTML = html;
}
function renderMacro(cv) {
  const u = T();
  let html = '';
  (S.stages || []).forEach((sm, i) => {
    const s = stageById(sm.id) || {};
    const nd = sm.noDurations;
    // queue before each stage box: its wait (Σ of its boxes), "?" when the stage has no duration, a plain arrow when there is no wait
    if (nd) html += `<div class="mlink" title="${esc(u.waitT)}: ?"><span class="tri">▽</span>?</div>`;
    else if (sm.wait > 0) html += `<div class="mlink" title="${esc(u.waitT)} (${u.sigma})"><span class="tri">▽</span>${fmtDays(sm.wait)}</div>`;
    else if (i > 0) html += `<div class="link" aria-hidden="true">→</div>`;
    const ai = sm.aiUses ? `${sm.aiUses} · <span class="notch" aria-hidden="true">${notch(sm.aiTopLevel)}</span>${esc(u.lv[sm.aiTopLevel] || sm.aiTopLevel)}` : u.none;
    const mks = Object.entries(sm.markersByKind || {}).map(([k, n]) => `${esc(u.mk[k] || k)} ×${n}`).join(', ') || u.none;
    const tags = [];
    if (!sm.detailed) tags.push(`<span class="tag">${u.notDetailed}</span>`);
    if (sm.status !== 'confirmed') tags.push(`<span class="tag tc">${u.toConfirm}</span>`);
    if (sm.reworkOut) tags.push(`<span class="tag rw">↩ ${sm.reworkOut}</span>`);
    if (sm.iterations) tags.push(`<span class="tag rw">↻ ${sm.iterations}</span>`);
    html += `<button type="button" class="mbox${sm.status !== 'confirmed' ? ' assumed' : ''}" data-box="${esc(sm.id)}|" data-mbox="${esc(sm.id)}">
      <div class="nm">${sm.n}. ${E(sm.name)}</div>
      ${sm.actors ? `<div class="ln">${EL(sm.actors)}</div>` : ''}
      ${sm.tools ? `<div class="ln tools">${EL(sm.tools)}</div>` : ''}
      <div class="tm"><span class="w">▽ ${nd ? '?' : fmtDays(sm.wait)}</span> · <span class="k">${u.workT} ${nd ? '?' : fmtDays(sm.work)}</span> · ${u.leadShort} <b>${nd ? '?' : fmtDays(sm.lead)}</b></div>
      ${sm.withoutWork ? `<div class="ln" style="color:var(--red)">${esc(u.boxesNoWork(sm.withoutWork))}</div>` : ''}
      <div class="ln">${u.rolledCA}: ${sm.rolledCA == null ? esc(u.notMeasured) : `<span class="ca ${caClass(sm.rolledCA)}">${sm.rolledCA} %</span>`}</div>
      ${sm.batches && sm.batches.length ? `<div class="ln">${u.batch}: ${sm.batches.map(E).join(', ')}</div>` : ''}
      <div class="ln">${u.ai}: ${ai}</div>
      <div class="ln">${u.markers}: ${mks}</div>
      ${tags.length ? `<div class="badges">${tags.join('')}</div>` : ''}
    </button>`;
  });
  html += timelineHtml(false);
  cv.innerHTML = html;
}
function timelineHtml(detailed) {
  // one cell per stage, in the same grid column as the stage (row 3); grid columns interleave links and stages
  let h = '';
  (S.stages || []).forEach((sm, i) => {

function anchorEl(cv, sid, pid) {

function drawArrows() {
  const cv = $('#canvas');
  const old = cv.querySelector('svg.arrows'); if (old) old.remove();
  cv.querySelectorAll('.box.end,.mbox.end,.box.sel,.mbox.sel').forEach((b) => b.classList.remove('end', 'sel'));
  const vis = visibleLoops();
  cv.style.setProperty('--lanes', `${vis.length ? vis.length * 26 + 18 : 14}px`);
  if (sel && sel.type === 'box') { const a = anchorEl(cv, sel.stage, view === 'macro' ? '' : sel.step); const b = a && (a.matches('button') ? a : a.querySelector('.box')); if (b) b.classList.add('sel'); }
  if (!vis.length) return;
  const base = cv.getBoundingClientRect();
  // lanes start under the lowest box of the whole map
  let bottom = 0;
  cv.querySelectorAll(view === 'macro' ? '.mbox' : '.frame').forEach((f) => { bottom = Math.max(bottom, f.getBoundingClientRect().bottom - base.top); });
  const pt = (sid, pid) => {
    const a = anchorEl(cv, sid, pid); if (!a) return null;
    const box = a.matches('button') ? a : a.querySelector('.box');
    box.classList.add('end');
    const br = box.getBoundingClientRect();
    let x = br.left - base.left + br.width / 2, y;
    if (view === 'macro') { y = br.bottom - base.top; }
    else {
      const col = a.closest('[data-col]'); const units = [...col.querySelectorAll('.unit')]; const k = units.length, idx = units.indexOf(a);
      x = br.left - base.left + br.width * (idx + 1) / (k + 1);
      y = col.getBoundingClientRect().bottom - base.top;
    }
    return { x, y };
  };
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('class', 'arrows');
  svg.setAttribute('width', cv.scrollWidth); svg.setAttribute('height', cv.scrollHeight);
  let parts = '';
  vis.forEach((l, i) => {
    const m = view === 'macro';
    const a = pt(l.from, m ? '' : l.fromStep), b = pt(l.to, m ? '' : l.toStep);
    if (!a || !b) return;
    const ly = bottom + 14 + i * 26;
    let x1 = a.x, x2 = b.x;
    if (Math.abs(x1 - x2) < 1) { x1 -= 14; x2 += 14; }
    const cls = `ln${l.confirm ? ' confirm' : ''}`;
    parts += `<circle cx="${x1}" cy="${a.y + 2}" r="3"></circle>`;
    parts += `<path class="${cls}" d="M${x1},${a.y + 2} L${x1},${ly} L${x2},${ly} L${x2},${b.y + 8}"></path>`;
    parts += `<path class="head" d="M${x2 - 5},${b.y + 9} L${x2},${b.y + 1} L${x2 + 5},${b.y + 9} Z"></path>`;
    const cap = `${isIter(l) ? '↻' : '↩'} ${tr(l.count || l.label || l.id)}${l.confirm ? ' · ' + T().toConfirm : ''}`;
    const tx = isIter(l) ? Math.max(x1, x2) + 6 : (x1 + x2) / 2;
    parts += `<text x="${tx}" y="${ly - 4}" text-anchor="${isIter(l) ? 'start' : 'middle'}">${esc(cap)}</text>`;
  });
  svg.innerHTML = parts;
  cv.appendChild(svg);
}

const json = $('#vsm-data').textContent;
const fname = `${String((D.case && D.case.title) || 'value-stream-map').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60).replace(/-$/, '')}.json`;

// Download: through the host's download capability when the page runs as a Claude artifact that grants it

(async () => {
